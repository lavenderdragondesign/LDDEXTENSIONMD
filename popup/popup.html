<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>LDD Tools</title></head><body>
<header><img src="../assets/icons/icon48.png" alt="LDD"><div><small>LAVENDER DRAGON DESIGN</small><h1>LDD Tools</h1></div></header>
<main>
 <div class="label">MODE</div><div class="modes"><button id="modeLite" data-mode="lite"><span class="check">✓</span> Lite</button><button id="modePower" data-mode="power"><span class="check">✓</span> Power User</button></div>
 <div class="control master"><div><b>Master LDD Tools</b><span>Enable or disable the extension on MyDesigns.</span></div><div class="pair"><button data-setting="lddMasterEnabled" data-value="true">ON</button><button data-setting="lddMasterEnabled" data-value="false">OFF</button></div></div>
 <div class="control"><div><b>Drag & Drop Upload</b><span>Drop files into MyDesigns upload.</span></div><div class="pair"><button data-setting="dragUpload" data-value="true">ON</button><button data-setting="dragUpload" data-value="false">OFF</button></div></div>
 <div class="control"><div><b>Carousel Renamer</b><span>Enable or disable the renamer.</span></div><div class="pair"><button data-setting="carouselRenamer" data-value="true">ON</button><button data-setting="carouselRenamer" data-value="false">OFF</button></div></div>
</main>
